name: اختبارات الأمان

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Unpack ZIP Upload"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-relay.txt
      - name: توثيق التزام المصدر المختبر
        run: git rev-parse HEAD
      - name: تثبيت متطلبات الاختبار
        run: python -m pip install -r requirements.txt -r requirements-relay.txt
      - name: فحص تركيب بايثون
        run: python -m compileall -q core platforms tests tools
      - name: اختبارات الوحدة والانحدار دون إرسال حقيقي
        run: python -m unittest discover -s tests -v
