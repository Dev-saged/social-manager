name: Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "رقم النسخة (مثال 2.0.0)"
        required: true
        default: "2.0.0"
      publish:
        description: "انشر Release بعد نجاح الاختبار"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KS" && test -n "$KSP" || { echo "::error::signing secrets are missing"; exit 1; }
      - name: Decode keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        working-directory: android
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: social-manager
        run: ./gradlew --no-daemon :app:assembleRelease -PappVersionName=${{ inputs.version }}
      - name: Verify signature and metadata
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | head -1
          mkdir -p dist
          cp "$APK" "dist/social-manager-v${{ inputs.version }}.apk"
          (cd dist && sha256sum "social-manager-v${{ inputs.version }}.apk" > "social-manager-v${{ inputs.version }}.apk.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/
          if-no-files-found: error

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install on emulator and check the local server
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/ci/emulator-check.sh dist/social-manager-v${{ inputs.version }}.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-output
          path: android/ci-out/

  release:
    needs: [build, emulator-test]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v${{ inputs.version }}"
          printf '%s\n' \
            "نسخة جديدة كاملة من مدير حساباتي (تثبيت جديد، لا ترقية ولا نقل بيانات)." \
            "" \
            "- ثبّت الملف social-manager-v${{ inputs.version }}.apk على أندرويد 7.0 أو أحدث." \
            "- التطبيق موقّع بمفتاح الإصدار، ونجح تشغيله على محاكي أندرويد قبل النشر." \
            "- الإنستغرام الشخصي (instagrapi) غير مدعوم في نسخة أندرويد، والربط الرسمي يعمل." \
            "- بصمة الملف في social-manager-v${{ inputs.version }}.apk.sha256" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "مدير حساباتي $TAG" --notes-file notes.md
          fi
